name: zune-jpeg paired benchmark

on:
  workflow_dispatch:
    inputs:
      rounds:
        description: "Rounds"
        default: "30"
      thread_rounds:
        description: "Unused in this experiment"
        default: "0"

permissions:
  contents: read

jobs:
  bench:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build harnesses
        shell: bash
        run: >-
          python bench/build.py bins
          dev=origin/dev
          dev_aa=origin/dev
          c1=844f6dc7
          c1a=origin/exp/c1a
          c1b=origin/exp/c1b
      - name: Experiment (c1 = ZCursor commit; c1a = only read_exact_bytes part; c1b = only read_byte part)
        shell: bash
        env:
          ROUNDS: ${{ inputs.rounds }}
        run: |
          B=test-images/jpeg/benchmarks
          python bench/ab.py bins exp.json "$ROUNDS" 3 1 dev,dev_aa,c1,c1a,c1b \
            nosamp=$B/speed_bench.jpg:1:rgb \
            gray=$B/speed_bench.jpg:1:luma \
            rgba=$B/speed_bench.jpg:1:rgba \
            prog=$B/speed_bench_prog.jpg:1:rgb \
            scalar_nosamp=$B/speed_bench.jpg:0:rgb
          python bench/an.py exp.json dev --markdown --noise dev_aa >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: exp-${{ matrix.os }}
          path: "*.json"
