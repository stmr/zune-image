name: zune-jpeg paired benchmark

on:
  workflow_dispatch:
    inputs:
      rounds:
        description: "Rounds"
        default: "20"
      thread_rounds:
        description: "Unused"
        default: "0"

permissions:
  contents: read

jobs:
  bench:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build harnesses
        shell: bash
        run: >-
          python bench/build.py bins
          dev=origin/dev
          v2=origin/perf/jpeg-pr1-v2
          v2_aa=origin/perf/jpeg-pr1-v2
          thr=origin/perf/jpeg-threads
          pipe=origin/perf/jpeg-baseline-pipeline
      - name: Thread branches (thr/pipe at 1 thread and at the default 4, vs PR1 v2 and dev)
        shell: bash
        env:
          ROUNDS: ${{ inputs.rounds }}
        run: |
          B=test-images/jpeg/benchmarks
          T=test-images/jpeg
          python bench/ab.py bins exp.json "$ROUNDS" 3 1 dev,v2,v2_aa,thr:1,thr:4,pipe:1,pipe:4 \
            nosamp=$B/speed_bench.jpg:1:rgb \
            hvsamp=$B/speed_bench_hv_subsampling.jpg:1:rgb \
            gray=$B/speed_bench.jpg:1:luma \
            rgba=$B/speed_bench.jpg:1:rgba \
            prog=$B/speed_bench_prog.jpg:1:rgb \
            proghv=$B/speed_bench_prog_hv_sampling.jpg:1:rgb \
            scalar_prog=$B/speed_bench_prog.jpg:0:rgb \
            p160x120=$T/noninterleaved-dc-table-3-160x120.jpg:1:rgb \
            p256=$T/progressive_restart_420.jpg:1:rgb \
            b388x477=$T/2029.jpg:1:rgb \
            b640=$T/baseline_non_interleaved.jpg:1:rgb \
            p650x470=$T/progressive_dc_huffman_table_1.jpg:1:rgb \
            p800x600=$T/rebuilt_relax_fill_bytes_before_marker.jpg:1:rgb \
            b1280x720=$T/mjpeg_huffman.jpg:1:rgb \
            p1920x1080=$T/huffman_third_index.jpg:1:rgb
          {
            echo "## ${{ matrix.os }}: vs PR1 v2 (bound from v2_aa)"
            python bench/an.py exp.json v2 --markdown --exclude dev --noise v2_aa
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: exp-${{ matrix.os }}
          path: "*.json"
