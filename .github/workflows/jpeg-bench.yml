name: zune-jpeg paired benchmark

on:
  workflow_dispatch:
    inputs:
      rounds:
        description: "Rounds for the single-thread gate"
        default: "30"
      thread_rounds:
        description: "Rounds for the multi-thread comparison"
        default: "20"

permissions:
  contents: read

jobs:
  bench:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Machine
        shell: bash
        run: |
          uname -a
          python -c "import os; print('cpus', os.cpu_count())"
          if [ -f /proc/cpuinfo ]; then grep -m1 -E 'model name|flags' /proc/cpuinfo || true; grep -o -m1 -w avx2 /proc/cpuinfo || true; fi
          rustc --version
      - name: Build harnesses
        shell: bash
        run: >-
          python bench/build.py bins
          dev=origin/dev
          reg=origin/perf/jpeg-regression-0.5
          thr=origin/perf/jpeg-threads
          scans=origin/perf/jpeg-prog-scans-parallel
          pipe=origin/perf/jpeg-baseline-pipeline
          reg_aa=origin/perf/jpeg-regression-0.5
      - name: Single-thread gate
        shell: bash
        env:
          ROUNDS: ${{ inputs.rounds }}
        run: |
          B=test-images/jpeg/benchmarks
          python bench/ab.py bins single.json "$ROUNDS" 3 1 dev,reg,reg_aa,thr:1,scans:1,pipe:1 \
            nosamp=$B/speed_bench.jpg:1:rgb \
            hsamp=$B/speed_bench_horizontal_subsampling.jpg:1:rgb \
            vsamp=$B/speed_bench_vertical_subsampling.jpg:1:rgb \
            hvsamp=$B/speed_bench_hv_subsampling.jpg:1:rgb \
            gray=$B/speed_bench.jpg:1:luma \
            rgba=$B/speed_bench.jpg:1:rgba \
            prog=$B/speed_bench_prog.jpg:1:rgb \
            progh=$B/speed_bench_prog_h_sampling.jpg:1:rgb \
            progv=$B/speed_bench_prog_v_sampling.jpg:1:rgb \
            proghv=$B/speed_bench_prog_hv_sampling.jpg:1:rgb \
            scalar_nosamp=$B/speed_bench.jpg:0:rgb \
            scalar_prog=$B/speed_bench_prog.jpg:0:rgb
          {
            echo "## ${{ matrix.os }}: single thread vs dev"
            python bench/an.py single.json dev --markdown
            echo
            echo "## ${{ matrix.os }}: threads=1 vs regression branch"
            python bench/an.py single.json reg --markdown --exclude dev --exclude reg_aa
            echo
            echo "## ${{ matrix.os }}: A/A control (same source as reg, different code layout)"
            python bench/an.py single.json reg --markdown --exclude dev --exclude thr:1 --exclude scans:1 --exclude pipe:1
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Multi-thread comparison
        shell: bash
        env:
          ROUNDS: ${{ inputs.thread_rounds }}
        run: |
          B=test-images/jpeg/benchmarks
          python bench/ab.py bins threads.json "$ROUNDS" 3 1 \
            thr:1,thr:2,thr:4,scans:2,scans:4,pipe:2,pipe:4 \
            nosamp=$B/speed_bench.jpg:1:rgb \
            hvsamp=$B/speed_bench_hv_subsampling.jpg:1:rgb \
            prog=$B/speed_bench_prog.jpg:1:rgb \
            progh=$B/speed_bench_prog_h_sampling.jpg:1:rgb \
            progv=$B/speed_bench_prog_v_sampling.jpg:1:rgb \
            proghv=$B/speed_bench_prog_hv_sampling.jpg:1:rgb \
            scalar_prog=$B/speed_bench_prog.jpg:0:rgb
          {
            echo "## ${{ matrix.os }}: threads vs thr:1"
            python bench/an.py threads.json thr:1 --markdown
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Enforce single-thread gate (no regression vs dev, threads=1 vs regression branch)
        shell: bash
        run: |
          python bench/an.py single.json dev --exclude reg_aa --gate > /dev/null
          python bench/an.py single.json reg --exclude dev --exclude reg_aa --gate > /dev/null
        # The multi-thread comparison above stays report-only.
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: bench-${{ matrix.os }}
          path: "*.json"
