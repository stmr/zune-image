name: zune-jpeg paired benchmark

on:
  workflow_dispatch:
    inputs:
      rounds:
        description: "Rounds"
        default: "30"
      thread_rounds:
        description: "Unused in this experiment"
        default: "0"

permissions:
  contents: read

jobs:
  bench:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build harnesses
        shell: bash
        run: >-
          python bench/build.py bins
          dev=origin/dev
          dev_aa=origin/dev
          v2=origin/perf/jpeg-pr1-v2
      - name: PR1 v2 follow-up on macOS scalar cases (60 rounds)
        shell: bash
        env:
          ROUNDS: ${{ inputs.rounds }}
        run: |
          B=test-images/jpeg/benchmarks
          python bench/ab.py bins exp.json "$ROUNDS" 3 1 dev,dev_aa,v2 \
            scalar_nosamp=$B/speed_bench.jpg:0:rgb \
            scalar_prog=$B/speed_bench_prog.jpg:0:rgb
          python bench/an.py exp.json dev --markdown --noise dev_aa >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: exp-${{ matrix.os }}
          path: "*.json"
